name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SOCIAL_INSIGHT_STORAGE_BACKEND: memory
      SOCIAL_INSIGHT_SEED_ON_STARTUP: "false"
      SOCIAL_INSIGHT_LOG_LEVEL: WARNING
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Poetry
        run: pipx install poetry==1.8.5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: poetry
          cache-dependency-path: backend/poetry.lock

      - name: Install dependencies
        run: poetry install --with dev --no-root

      - name: Lint backend
        run: poetry run ruff check app tests

      - name: Test backend
        run: poetry run pytest

  frontend:
    name: Frontend Vue
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test:unit

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker images & E2E
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build Docker images
        run: docker compose build

      - name: Start application
        run: docker compose up -d

      - name: Wait for application
        run: |
          for _ in {1..60}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8000/api/health \
              && curl --fail --silent --output /dev/null http://127.0.0.1:5173; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Test end-to-end
        working-directory: frontend
        run: npm run test:e2e

      - name: Show application logs
        if: failure()
        run: docker compose logs

      - name: Upload E2E traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop application
        if: always()
        run: docker compose down
