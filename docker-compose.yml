services:
  backend:
    build:
      context: ./backend
    environment:
      SOCIAL_INSIGHT_ENVIRONMENT: local
      SOCIAL_INSIGHT_STORAGE_BACKEND: memory
      SOCIAL_INSIGHT_CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend
